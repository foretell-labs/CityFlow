[project]
name = "city-flow"
version = "0.1.0"
description = "Predicting bike-sharing station shortages"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas[output-formatting,plot]>=2.2",
    "duckdb>=1.1",
    "scikit-learn>=1.5",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
]

[dependency-groups]
lint = [
    "pre-commit>=4.7.0",
    "pyrefly>=1.4.1",
    "ruff>=0.17.5",
]
notebook = [
    "ipykernel>=7.4.0",
]
test = [
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.uv]
default-groups = ["lint", "test", "notebook"]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
ignore = []
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
indent-style = "space"
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pyrefly]
preset = "default"
python-version = "3.14"
project-includes = [
    "**/*.py",
    "**/*.pyi",
    "**/*.ipynb",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib", # avoids test-file name clashes
]
markers = [
    "data: needs the real dataset (skipped in CI)",
    "slow: takes more than a few seconds",
]
